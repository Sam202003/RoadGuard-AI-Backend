openapi: 3.0.3
info:
  title: Road Guard API
  description: |
    Road Guard MVP — breakdown assistance platform REST API.

    ## Authentication
    Most endpoints require a JWT access token from `POST /auth/login` or `POST /auth/register`.
    Click **Authorize** and enter: `Bearer <your-access-token>`
  version: 1.0.0
  contact:
    name: Road Guard
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: https://roadguard-api.onrender.com/api/v1
    description: Production (Render)

tags:
  - name: Health
  - name: Auth
  - name: Admin
  - name: Providers
  - name: Vehicles
  - name: Breakdown Requests
  - name: Notifications
  - name: AI

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from login/register/refresh

  schemas:
    ApiSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation successful
        data:
          type: object
        meta:
          type: object

    ApiError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation failed

    AuthUser:
      type: object
      properties:
        id:
          type: string
          example: 507f1f77bcf86cd799439011
        firstName:
          type: string
          example: Priya
        lastName:
          type: string
          example: Sharma
        email:
          type: string
          example: priya@example.com
        phoneNumber:
          type: string
          example: '+919876543210'
        role:
          type: string
          enum: [CUSTOMER, PROVIDER, ADMIN]
        isEmailVerified:
          type: boolean
        isPhoneVerified:
          type: boolean
        isActive:
          type: boolean

    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: string
          example: 15m

    RegisterRequest:
      type: object
      required: [firstName, lastName, email, phoneNumber, password]
      properties:
        firstName:
          type: string
          example: Priya
        lastName:
          type: string
          example: Sharma
        email:
          type: string
          example: priya@example.com
        phoneNumber:
          type: string
          example: '+919876543210'
        password:
          type: string
          format: password
          example: Demo@12345
        role:
          type: string
          enum: [CUSTOMER, PROVIDER]
          default: CUSTOMER

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: admin@roadguard.demo
        password:
          type: string
          format: password
          example: Demo@12345

    AdminDashboardStats:
      type: object
      properties:
        totalUsers:
          type: integer
          example: 42
        totalCustomers:
          type: integer
          example: 30
        totalProviders:
          type: integer
          example: 10
        activeBreakdownRequests:
          type: integer
          example: 5
        completedRequests:
          type: integer
          example: 120
        emergencyRequests:
          type: integer
          example: 3
        onlineProviders:
          type: integer
          example: 4

    UpdateUserStatusRequest:
      type: object
      required: [isActive]
      properties:
        isActive:
          type: boolean
          example: false

    UpdateProviderKycRequest:
      type: object
      required: [kycStatus]
      properties:
        kycStatus:
          type: string
          enum: [PENDING, VERIFIED, REJECTED]
          example: VERIFIED

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              example:
                success: true
                message: Service is healthy
                data:
                  status: ok
                  infrastructure:
                    mongodb:
                      connected: true
                    redis:
                      connected: true

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              example:
                success: true
                message: Registration successful
                data:
                  user:
                    id: 507f1f77bcf86cd799439011
                    firstName: Priya
                    lastName: Sharma
                    email: priya@example.com
                    role: CUSTOMER
                  tokens:
                    accessToken: eyJhbGciOiJIUzI1NiIs...
                    refreshToken: eyJhbGciOiJIUzI1NiIs...
                    expiresIn: 15m

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              example:
                success: true
                message: Login successful
                data:
                  user:
                    id: 507f1f77bcf86cd799439011
                    email: admin@roadguard.demo
                    role: ADMIN
                  tokens:
                    accessToken: eyJhbGciOiJIUzI1NiIs...
                    refreshToken: eyJhbGciOiJIUzI1NiIs...
                    expiresIn: 15m

  /auth/refresh-token:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token refreshed

  /auth/me:
    get:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: Get current user profile
      responses:
        '200':
          description: Profile fetched
          content:
            application/json:
              example:
                success: true
                message: Profile fetched
                data:
                  user:
                    id: 507f1f77bcf86cd799439011
                    firstName: Admin
                    role: ADMIN

  /auth/logout:
    post:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: Logout current session
      responses:
        '200':
          description: Logged out

  /admin/dashboard:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Admin dashboard stats and activity
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              example:
                success: true
                message: Admin dashboard fetched successfully
                data:
                  stats:
                    totalUsers: 42
                    totalCustomers: 30
                    totalProviders: 10
                    activeBreakdownRequests: 5
                    completedRequests: 120
                    emergencyRequests: 3
                    onlineProviders: 4
                  activity:
                    - id: 507f1f77bcf86cd799439012
                      type: emergency
                      title: FLAT_TIRE — IN_PROGRESS
                      description: Customer a43901 · Provider b43902
                      timestamp: '2026-06-19T10:30:00.000Z'

  /admin/analytics:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Platform analytics
      responses:
        '200':
          description: Analytics summary

  /admin/users:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: List users (paginated)
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            example: 1
        - in: query
          name: limit
          schema:
            type: integer
            example: 20
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: role
          schema:
            type: string
            enum: [CUSTOMER, PROVIDER, ADMIN]
      responses:
        '200':
          description: Users list
          content:
            application/json:
              example:
                success: true
                message: Users fetched successfully
                data:
                  users:
                    - id: 507f1f77bcf86cd799439011
                      firstName: Priya
                      lastName: Sharma
                      email: priya@example.com
                      role: CUSTOMER
                      isActive: true
                meta:
                  page: 1
                  limit: 20
                  total: 42
                  totalPages: 3

  /admin/users/{id}:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Get user by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User details

  /admin/users/{id}/status:
    patch:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Enable or disable user account
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: User status updated
          content:
            application/json:
              example:
                success: true
                message: User status updated successfully
                data:
                  user:
                    id: 507f1f77bcf86cd799439011
                    isActive: false

  /admin/providers:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: List providers (paginated)
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: onlineStatus
          schema:
            type: string
            enum: [ONLINE, OFFLINE]
      responses:
        '200':
          description: Providers list

  /admin/providers/{id}:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Get provider by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Provider details

  /admin/providers/{id}/kyc-status:
    patch:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Update provider KYC status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProviderKycRequest'
      responses:
        '200':
          description: KYC status updated

  /providers/nearby:
    get:
      tags: [Providers]
      security: [{ bearerAuth: [] }]
      summary: Find nearby providers (public fields only)
      parameters:
        - in: query
          name: longitude
          required: true
          schema:
            type: number
        - in: query
          name: latitude
          required: true
          schema:
            type: number
        - in: query
          name: radiusKm
          schema:
            type: number
            default: 10
      responses:
        '200':
          description: Nearby providers

  /providers/me:
    get:
      tags: [Providers]
      security: [{ bearerAuth: [] }]
      summary: Get my provider profile
      responses:
        '200':
          description: Provider profile

  /vehicles:
    get:
      tags: [Vehicles]
      security: [{ bearerAuth: [] }]
      summary: List customer vehicles
      responses:
        '200':
          description: Vehicle list
    post:
      tags: [Vehicles]
      security: [{ bearerAuth: [] }]
      summary: Register a vehicle
      responses:
        '201':
          description: Vehicle created

  /breakdown-requests:
    get:
      tags: [Breakdown Requests]
      security: [{ bearerAuth: [] }]
      summary: List breakdown requests
      responses:
        '200':
          description: Request list
    post:
      tags: [Breakdown Requests]
      security: [{ bearerAuth: [] }]
      summary: Create breakdown request
      responses:
        '201':
          description: Request created

  /breakdown-requests/{id}:
    get:
      tags: [Breakdown Requests]
      security: [{ bearerAuth: [] }]
      summary: Get breakdown request detail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Request detail

  /notifications:
    get:
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      summary: List notifications
      responses:
        '200':
          description: Notifications

  /notifications/unread-count:
    get:
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      summary: Unread notification count
      responses:
        '200':
          description: Count

  /ai/diagnose:
    post:
      tags: [AI]
      security: [{ bearerAuth: [] }]
      summary: AI breakdown diagnosis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                issueDescription:
                  type: string
                  example: Car won't start, clicking sound when turning key
                issueType:
                  type: string
                  example: BATTERY
      responses:
        '200':
          description: Diagnosis result
